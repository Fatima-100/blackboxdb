<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - BlackBoxDB</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#0f1b2d;font-family:'IBM Plex Sans',system-ui,sans-serif}
.box{width:min(380px,92vw);background:#fff;border-radius:14px;padding:30px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand span{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:700;color:#0f1b2d;line-height:1}
.brand b{color:#ff6a13}
.btn-login{background:#ff6a13;border-color:#ff6a13;color:#111;font-weight:600}
.btn-login:hover{background:#e55a0a;border-color:#e55a0a;color:#111}
</style></head><body>
<div class="box">
 <div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
  <rect x="2" y="8" width="36" height="24" rx="5" fill="#ff6a13"/><rect x="2" y="16" width="36" height="3" fill="#fff" opacity=".9"/>
  <rect x="2" y="22" width="36" height="3" fill="#fff" opacity=".9"/><circle cx="9" cy="28.5" r="1.7" fill="#0f1b2d"/>
  <path d="M25 12.5h9" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round"/></svg>
  <span>BlackBox<b>DB</b></span></div>
 <p class="text-muted">Log in to continue</p>
 {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="alert alert-{{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
 <form method="post">
  <label class="form-label">Username</label><input name="username" class="form-control mb-3" autofocus required>
  <label class="form-label">Password</label><input type="password" name="password" class="form-control mb-3" required>
  <button class="btn btn-login w-100">Log in</button>
 </form>
</div></body></html>
