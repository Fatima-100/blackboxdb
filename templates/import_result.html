{% extends "base.html" %}
{% block body %}
<h3>Import finished</h3>
<p class="text-secondary">File <strong>{{ b.file_name }}</strong> (batch #{{ b.batch_id }}).</p>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card p-3"><div class="text-secondary small">Imported</div><div class="fs-1 fw-bold">{{ imported }}</div></div></div>
  <div class="col-md-4"><div class="card p-3"><div class="text-secondary small">Skipped (duplicates)</div><div class="fs-1 fw-bold">{{ skipped }}</div></div></div>
  <div class="col-md-4"><div class="card p-3"><div class="text-secondary small">Errors</div><div class="fs-1 fw-bold">{{ errors }}</div></div></div>
</div>
<div class="d-flex flex-wrap gap-2">
  {% if errors %}<a class="btn btn-outline-dark" href="{{ url_for('import_errors', bid=b.batch_id) }}">Download error rows (CSV)</a>{% endif %}
  <a class="btn btn-primary" href="{{ url_for('incidents') }}">View incidents</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('import_page') }}">Upload another file</a>
</div>
{% endblock %}
